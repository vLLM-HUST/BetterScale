<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550">
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<style>text{font-family:'FandolHei','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#172b42}.h{font-size:22px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#53667c}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{rx:12;stroke-width:1.4}</style>
<rect width="1240" height="550" rx="18" fill="#f8fafc"/>
<text x="32" y="40" class="h">执行边界重组，而不是替换 serving engine</text>
<text x="32" y="65" class="s">语义图 · 非按时延比例绘制 · 原生 scheduler / KV / sampling / shared-expert overlap 保留</text>
<rect x="24" y="90" width="1192" height="124" rx="12" fill="#edf2f7"/>
<text x="42" y="116" class="s">HOST：稳定输入契约</text>
<rect x="55" y="133" width="226" height="58" class="box" fill="#fff" stroke="#b5c4d5"/>
<text x="76" y="168" class="t">原生调度与资源预算</text>
<path d="M283 162H322" class="line"/>
<rect x="326" y="133" width="372" height="58" class="box" fill="#e1f0fe" stroke="#4387bd"/>
<text x="345" y="157" class="t">固定 metadata 地址、形状与容量</text>
<text x="345" y="181" class="s">RoPE 持久缓冲 · 空席位零长度 · LCM 对齐</text>
<path d="M700 162H740" class="line"/>
<rect x="744" y="133" width="411" height="58" class="box" fill="#fff2d8" stroke="#caa04a"/>
<text x="763" y="157" class="t">稳定 K5：CPU 维护保守上界</text>
<text x="763" y="181" class="s">精确进度、位置与 slot mapping 仍由 device 决定</text>
<rect x="24" y="232" width="1192" height="191" rx="12" fill="#e9f5f1"/>
<text x="42" y="259" class="s">DEVICE：保持依赖，减少重复发射</text>
<rect x="55" y="282" width="226" height="66" class="box" fill="#d0eadd" stroke="#3b8c6c"/>
<text x="77" y="310" class="t">Target FULL replay</text><text x="77" y="335" class="s">prefill / mixed / decode</text>
<path d="M512 193V224H168V278" class="line"/>
<path d="M285 315H325" class="line"/>
<rect x="329" y="282" width="335" height="66" class="box" fill="#fff" stroke="#3b8c6c"/>
<text x="348" y="310" class="t">原生 draft context KV 写入</text><text x="348" y="335" class="s">真实 N 行；不再补到全局 prefill 预算</text>
<path d="M668 315H711" class="line"/>
<rect x="715" y="282" width="260" height="66" class="box" fill="#e8def6" stroke="#8863aa"/>
<text x="734" y="310" class="t">小 query graph replay</text><text x="734" y="335" class="s">1–4 请求 · 独立 metadata bank</text>
<path d="M979 315H1019" class="line"/>
<text x="1037" y="309" class="t">原生采样</text><text x="1037" y="336" class="t">与拒绝验证</text>
<text x="58" y="392" class="s">普通 decode 保留小 context + query 的融合图；非普通波次才拆分。首次 capture 后必须显式 replay，再交付结果。</text>
<path d="M1076 350V469H691" class="line"/>
<rect x="327" y="442" width="359" height="60" class="box" fill="#fff2d8" stroke="#caa04a"/>
<text x="346" y="468" class="t">target 提交后再处理 CPU 收据</text><text x="346" y="490" class="s">先确认当前 input DMA 结束，再修改 pinned host 数据</text>
<text x="39" y="529" class="s">边界：仅稳定 K5 波次延后 bookkeeping；请求变动与 mixed 等未准入情形走原有同步路径。不是完整 N+2 调度器。</text>
</svg>
